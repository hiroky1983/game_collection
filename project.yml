name: GameCollection
options:
  bundleIdPrefix: com.hirockysan1983.asobiba
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GameKit:
    path: Packages/GameKit
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 11.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.17.0

targets:
  GameCollection:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
    resources:
      - App/PrivacyInfo.xcprivacy
      - App/Assets.xcassets
      - App/GoogleService-Info.plist
    dependencies:
      - package: GameKit
        product: Core
      - package: GameKit
        product: Game2048
      - package: GameKit
        product: GameShogi
      - package: GameKit
        product: GameGomoku
      - package: GameKit
        product: GameMinesweeper
      - package: GameKit
        product: GameOthello
      - package: GameKit
        product: GamePoker
      - package: GameKit
        product: GameConcentration
      - package: GameKit
        product: GameBlackjack
      - package: GameKit
        product: GameDaifugo
      - package: GameKit
        product: GameMahjongSolitaire
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: あそびば
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        GADApplicationIdentifier: ca-app-pub-1869410932032409~4823987816
        NSUserTrackingUsageDescription: より関連性の高い広告を表示するために使用します。
        ITSAppUsesNonExemptEncryption: false
    postBuildScripts:
      # Crashlytics のクラッシュを記号化するための dSYM アップロード（Firebase 公式手順）
      # SPM のチェックアウト先を移動する（-clonedSourcePackagesDirPath 等）と
      # run が見つからずビルドが落ちるため、存在確認してから実行する。
      - name: Firebase Crashlytics
        script: |
          RUN="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ -x "$RUN" ]; then
            "$RUN"
          else
            echo "warning: Crashlytics の run が見つからないため dSYM アップロードをスキップしました ($RUN)"
          fi
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - $(SRCROOT)/$(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hirockysan1983.asobiba
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: WLUV6S77T5
        CODE_SIGN_STYLE: Automatic
        # Firebase の静的ライブラリ内のクラス・カテゴリを取り込むために必須。
        # 無いと FirebaseAnalytics が実バイナリからリンク落ちし、Crashlytics が
        # 「Firebase Analytics SDK not detected」となる（Firebase 公式要件）。
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
