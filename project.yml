name: GameCollection
options:
  bundleIdPrefix: com.hirockysan1983.asobiba
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GameKit:
    path: Packages/GameKit
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.17.0

targets:
  GameCollection:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Localization
          - "Localization/**"
      # 文言の表（String Catalog・多言語① #2109）。Xcode にコンパイルさせず、folder 参照でそのまま同梱する。
      # アプリ内で選んだ言語（システムの言語とは別）で引くため、GameKit の各モジュールと同じく
      # `StringTable` が実行時に JSON を読む（理由は Packages/GameKit/Sources/CoreEngine/StringTable.swift）。
      - path: App/Localization
        type: folder
        buildPhase: resources
    resources:
      - App/PrivacyInfo.xcprivacy
      - App/Assets.xcassets
      - App/GoogleService-Info.plist
    # Game Center（#289 段階①）。iOS の App ID では Game Center が既定で有効なため、
    # プロビジョニング側の追加操作は不要（entitlement と ASC のバージョン設定だけで済む）。
    # このファイルは xcodegen generate が properties から自動生成する。
    entitlements:
      path: App/GameCollection.entitlements
      properties:
        com.apple.developer.game-center: true
    dependencies:
      - package: GameKit
        product: Core
      - package: GameKit
        product: Game2048
      - package: GameKit
        product: GameShogi
      - package: GameKit
        product: GameGomoku
      - package: GameKit
        product: GameMinesweeper
      - package: GameKit
        product: GameOthello
      - package: GameKit
        product: GamePoker
      - package: GameKit
        product: GameConcentration
      - package: GameKit
        product: GameBlackjack
      - package: GameKit
        product: GameDaifugo
      - package: GameKit
        product: GameMahjongSolitaire
      - package: GameKit
        product: GameMahjong
      - package: GameKit
        product: GameSudoku
      - package: GameKit
        product: GameGo
      - package: GameKit
        product: GameSolitaire
      - package: GameKit
        product: GameChess
      - package: GameKit
        product: GameBlocks
      - package: GameKit
        product: GameFreeCell
      - package: GameKit
        product: GameRunner
      - package: GameKit
        product: GameHanafuda
      - package: GameKit
        product: GameSpider
      - package: GameKit
        product: GameShiritori
      - package: GameKit
        product: GameFifteen
      - package: GameKit
        product: GameRoulette
      - package: GameKit
        product: GameFruits
      - package: GameKit
        product: GameColorRelay
      - package: GameKit
        product: GameAnzan
      - package: GameKit
        product: GameBackgammon
      - package: GameKit
        product: GameMancala
      - package: GameKit
        product: GameSpeed
      - package: GameKit
        product: GameOldMaid
      - package: GameKit
        product: GameAkariKeshi
      - package: GameKit
        product: GameHomerun
      - package: GameKit
        product: GameOjisanPuzzle
      - package: GameKit
        product: GameHearts
      - package: GameKit
        product: GameTsunagi
      - package: GameKit
        product: GameDiceCombo
      - package: GameKit
        product: GameHanoi
      - package: GameKit
        product: GameYonmoku
      - package: GameKit
