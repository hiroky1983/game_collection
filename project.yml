        NSUserTrackingUsageDescription: より関連性の高い広告を表示するために使用します。
        ITSAppUsesNonExemptEncryption: false
        # Firebase の自動収集を既定オフにする（#382 の会長決裁 A）。`FirebaseApp.configure()` から
        # `applyAnalyticsCollectionState()` までの窓で session_start / first_open が出るのを塞ぐ。
        # 許可した経路では起動時に `setAnalyticsCollectionEnabled(true)` が立ち、SDK 側で永続化
        # されて plist より優先されるため、実ユーザーから取れるデータは減らない。
        # **App/Info.plist ではなくここに書く**。App/Info.plist は下の `info.path` の出力先で、
        # CI（ci.yml）と fastlane beta が毎回 `xcodegen generate` するたびに丸ごと再生成される。
        # plist だけに足しても、出荷するバイナリに届く前に静かに消える（#388 の取りこぼし）。
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
    postBuildScripts:
      # Crashlytics のクラッシュを記号化するための dSYM アップロード（Firebase 公式手順）
      # SPM のチェックアウト先を移動する（-clonedSourcePackagesDirPath 等）と
      # run が見つからずビルドが落ちるため、存在確認してから実行する。
      - name: Firebase Crashlytics
        script: |
          RUN="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ -x "$RUN" ]; then
            "$RUN"
          else
            echo "warning: Crashlytics の run が見つからないため dSYM アップロードをスキップしました ($RUN)"
          fi
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - $(SRCROOT)/$(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hirockysan1983.asobiba
        MARKETING_VERSION: "1.1.13"
        CURRENT_PROJECT_VERSION: "30"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        # 1 = iPhone / 2 = iPad（#458）。調べた競合 30 本すべてが iPad 対応で、
        # あそびばだけが iPhone 専用だった。iPad の App Store の検索結果に載るための前提。
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 6MGM38HWDH
        CODE_SIGN_STYLE: Automatic
        # Firebase の静的ライブラリ内のクラス・カテゴリを取り込むために必須。
        # 無いと FirebaseAnalytics が実バイナリからリンク落ちし、Crashlytics が
        # 「Firebase Analytics SDK not detected」となる（Firebase 公式要件）。
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
    # 共有スキームを明示的に生成する（UI テストターゲットを持っていた頃、fastlane が共有スキームしか探さず
    # GameCollection を見失った v1.1.8 出荷の経緯による。#2046 でターゲットは削除済み）
    scheme: {}
