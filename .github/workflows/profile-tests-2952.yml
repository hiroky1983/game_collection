name: Profile GameKit tests (#2952 一時)
on:
  pull_request:
    paths:
      - '.github/workflows/profile-tests-2952.yml'
permissions:
  contents: read
jobs:
  profile:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 直列で全テスト（個別の所要時間を取る）
        run: swift test --package-path Packages/GameKit --no-parallel --skip '^GameShogiTests\.SelfPlayTests/' 2>&1 | tee profile.log
      - name: 遅い順
        if: always()
        run: |
          grep -E "✔ Test .* passed after|✘ Test .* failed after" profile.log | sed -E 's/.*(Test .*) (passed|failed) after ([0-9.]+) seconds.*/\3\t\1/' | sort -rn | head -150
