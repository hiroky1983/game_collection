name: CI

on:
  push:
    branches: [main, 'release-*', 'release/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # アプリに関係する変更があるかの判定（会長指示 2026-09-27「Swift が無ければ CI のテストを回さない」）。
  # test / build は main の必須チェックなので、ワークフローの `paths` で起動ごと止めると結果が報告されず
  # PR が永久にマージできなくなる。起動はさせ、ジョブを if でスキップする（スキップは合格として数えられる）。
  # 「Swift が無ければ」ではなく逆向きに、変更が全部 docs/・Scripts/・web/・.github/（ci.yml を除く）・*.md に収まる PR だけを
  # スキップする。project.yml・Package.resolved・xcassets・Info.plist・xcstrings など Swift 以外でも
  # アプリを壊す変更を見逃さないため。push（main・release）は常に全部回す。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.detect.outputs.app }}
      gamekit: ${{ steps.detect.outputs.gamekit }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"; echo "gamekit=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 一覧が取れなければ安全側（全部回す）に倒す
          if ! files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename'); then
            echo "app=true" >> "$GITHUB_OUTPUT"; echo "gamekit=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$files"
          # classify:begin（Scripts/tests/test-ci-detect-app-changes.sh がこの範囲を取り出して検証する）
          # .github/ は運用系だが、ci.yml 自身は CI の壊れを見逃さないため必ず全部回す
          others=$(printf '%s\n' "$files" | grep -v -E '^(docs/|Scripts/|web/)|\.md$|^\.github/' | grep -v '^$' || true)
          if printf '%s\n' "$files" | grep -q -x -F '.github/workflows/ci.yml'; then
            others=".github/workflows/ci.yml"
          fi
          # build ジョブとリリース（fastlane）が依存の版を固定するために呼ぶ Scripts は、壊れても気づけるよう回す（#2045）
          if printf '%s\n' "$files" | grep -q -x -F 'Scripts/apply-package-resolved.sh'; then
            others="Scripts/apply-package-resolved.sh"
          fi
          # GameKit 全テスト（約 10 分）は Packages/・App/・Config/（Package.resolved）に変更がある PR だけ回す（#2471）。
          # 版数更新 PR（project.yml の 2 行）のようにアプリのコードが変わらない PR で待たされないため。
          # 拡張子では判定しない（テストは PNG・xcstrings・JSON も読む）。push（main・release）は上で常に回す。
          gamekit=$(printf '%s\n' "$files" | grep -E '^(Packages/|App/|Config/)' || true)
          if printf '%s\n' "$files" | grep -q -x -F '.github/workflows/ci.yml'; then
            gamekit=".github/workflows/ci.yml"
          fi
          # classify:end
          if [ -n "$others" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "アプリに関係する変更が無いため test / build をスキップする"
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
          # test は必須チェックなのでジョブごとは止めず、全テストのステップだけを飛ばして成功で終える
          if [ -n "$gamekit" ]; then
            echo "gamekit=true" >> "$GITHUB_OUTPUT"
          else
            echo "アプリのコードが変わらないため GameKit 全テストのステップをスキップする"
            echo "gamekit=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # パブリックリポジトリのため GitHub ホステッド macOS ランナーは無料
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 訳し漏れの検査（#2402）
        run: python3 Scripts/check-untranslated-ja.py

      # main には release 取り込み待ちの未圧縮画像が残ることがある（#2913。release/v1.1.14 取り込みで直る予定）。
      # リポジトリ全体を検査すると取り込みが済むまで main への push CI が落ち続けるため、
      # この PR / push で実際に追加・変更された PNG だけを検査する。差分が取れないときは
      # 見逃しを避けて全件検査にフォールバックする。
      - name: 画像の圧縮漏れの検査（#2913）
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 -m pip install --quiet Pillow || python3 -m pip install --quiet --break-system-packages Pillow

          if [ "$EVENT" = "pull_request" ]; then
            if ! git fetch --quiet origin "$BASE_REF:refs/remotes/origin/$BASE_REF"; then
              echo "base ブランチ（$BASE_REF）の取得に失敗したため全件検査にフォールバックする"
              exec python3 Scripts/compress-images.py --check
            fi
            if ! pngs="$(git diff --name-only --diff-filter=AMR "origin/$BASE_REF...HEAD" -- '*.png')"; then
              echo "差分の取得に失敗したため全件検査にフォールバックする"
              exec python3 Scripts/compress-images.py --check
            fi
          elif [ "$EVENT" = "push" ]; then
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              echo "新規ブランチへの最初の push のため画像の圧縮検査を飛ばす"
              exit 0
            fi
            if ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
              echo "push 前の commit（$BEFORE_SHA）が取得できないため全件検査にフォールバックする"
              exec python3 Scripts/compress-images.py --check
            fi
            if ! pngs="$(git diff --name-only --diff-filter=AMR "$BEFORE_SHA" "$GITHUB_SHA" -- '*.png')"; then
              echo "差分の取得に失敗したため全件検査にフォールバックする"
              exec python3 Scripts/compress-images.py --check
            fi
          else
            echo "画像の圧縮検査の対象外イベント（$EVENT）のため飛ばす"
            exit 0
          fi

          if [ -z "$pngs" ]; then
            echo "変更された PNG が無いため画像の圧縮検査を飛ばす"
            exit 0
          fi

          echo "検査対象:"
          echo "$pngs"
          # macOS の bash 3.2 には readarray が無い（exit 127 で落ちる）ので xargs で渡す
          printf '%s\n' "$pngs" | tr '\n' '\0' | xargs -0 python3 Scripts/compress-images.py --check

      # 将棋の自己対戦テスト（SelfPlayTests）は決定的だがCIの中で最も重い1本（実測304秒）で、
      # 将棋AI強化は中止済み（2026-08-10決裁）のためソースが変わる見込みが低い。
      # nightly-shogi-selfplay.yml へ分離する（#1039）。
      # skip は "GameShogiTests.SelfPlayTests/" の完全一致で絞る。単純な "SelfPlayTests" だと
      # 別ファイル（DifficultyTests.swift）の ShogiWeakLevelSelfPlayTests も部分一致で巻き込み、
      # 意図せず弱さ調整のテストまでCIから外れてしまう（実測で確認済み）。
      - name: GameKit 全テスト
        if: needs.changes.outputs.gamekit == 'true'
        run: swift test --package-path Packages/GameKit --skip '^GameShogiTests\.SelfPlayTests/'

  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: アプリ本体のビルド検証（署名なし）
        run: |
          brew install xcodegen
          xcodegen generate
          # 依存の版は Config/Package.resolved で固定する（#1579）。project.yml の指定と食い違うと
          # -disableAutomaticPackageResolution で落ちる（版を上げるときは Config/Package.resolved も更新する）
          bash Scripts/apply-package-resolved.sh
          xcodebuild -project GameCollection.xcodeproj \
            -scheme GameCollection \
            -disableAutomaticPackageResolution \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
