name: CI

on:
  push:
    branches: [main, 'release-*', 'release/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # GameKit 全テスト（約 10 分）を回すかの判定（#2471）。版数更新 PR（project.yml の 2 行）のように
  # アプリのコードが変わらない PR で待たされないため、Packages/・App/・Config/（Package.resolved）に
  # 変更がある PR だけ回す。拡張子では判定しない（テストは PNG・xcstrings・JSON も読む）。
  # test は必須チェックなので、ジョブ自体は走らせて全テストのステップだけを飛ばす（ジョブごと skip しない）。
  # push（main・release）は条件なしで必ず全部回す。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      gamekit: ${{ steps.detect.outputs.gamekit }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "gamekit=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 一覧が取れなければ安全側（全部回す）に倒す
          if ! files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename'); then
            echo "gamekit=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$files"
          # classify:begin（Scripts/tests/test-ci-detect-app-changes.sh がこの範囲を取り出して検証する）
          gamekit=$(printf '%s\n' "$files" | grep -E '^(Packages/|App/|Config/)' || true)
          # ci.yml 自身は CI の壊れを見逃さないため必ず回す
          if printf '%s\n' "$files" | grep -q -x -F '.github/workflows/ci.yml'; then
            gamekit=".github/workflows/ci.yml"
          fi
          # classify:end
          if [ -n "$gamekit" ]; then
            echo "gamekit=true" >> "$GITHUB_OUTPUT"
          else
            echo "アプリのコードが変わらないため GameKit 全テストのステップをスキップする"
            echo "gamekit=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    # パブリックリポジトリのため GitHub ホステッド macOS ランナーは無料
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # PR は base との差分（HEAD^1..HEAD）から走らせるテストを選ぶ（#2953）ので 2 世代要る
          fetch-depth: 2

      - name: テスト選別スクリプトの検証（#2953）
        run: bash Scripts/tests/test-select-gamekit-tests.sh

      - name: 訳し漏れの検査（#2402）
        run: python3 Scripts/check-untranslated-ja.py

      - name: 画像の圧縮漏れの検査（#2913）
        run: |
          python3 -m pip install --quiet Pillow || python3 -m pip install --quiet --break-system-packages Pillow
          python3 Scripts/compress-images.py --check

      # 将棋の自己対戦テスト（SelfPlayTests）は決定的だがCIの中で最も重い1本（実測304秒）で、
      # 将棋AI強化は中止済み（2026-08-10決裁）のためソースが変わる見込みが低い。
      # nightly-shogi-selfplay.yml へ分離する（#1039）。
      # skip は "GameShogiTests.SelfPlayTests/" の完全一致で絞る。単純な "SelfPlayTests" だと
      # 別ファイル（DifficultyTests.swift）の ShogiWeakLevelSelfPlayTests も部分一致で巻き込み、
      # 意図せず弱さ調整のテストまでCIから外れてしまう（実測で確認済み）。
      # PR は変更ファイルから影響を受けるテストターゲットだけを回す（#2953。選び方は Scripts/select-gamekit-tests.py）。
      # push（main・release）と、選別が失敗したときは全部回す。
      - name: GameKit テスト
        if: needs.changes.outputs.gamekit == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          filter=all
          if [ "$EVENT" = "pull_request" ]; then
            if files=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD) && filter=$(printf '%s\n' "$files" | python3 Scripts/select-gamekit-tests.py --explain); then
              :
            else
              echo "選別に失敗したため全部回す"; filter=all
            fi
          fi
          echo "選別結果: $filter"
          if [ "$filter" = "all" ]; then
            swift test --package-path Packages/GameKit --skip '^GameShogiTests\.SelfPlayTests/'
          elif [ "$filter" = "none" ]; then
            echo "GameKit のテストに関係する変更が無いため回さない"
          else
            # --filter は 0 件マッチでも緑になるため、1 件も走らなかったら落とす
            swift test --package-path Packages/GameKit --filter "$filter" --skip '^GameShogiTests\.SelfPlayTests/' 2>&1 | tee "$RUNNER_TEMP/gamekit-test.log"
            [ "${PIPESTATUS[0]}" -eq 0 ] || exit 1
            grep -Eq 'Test run with [1-9][0-9]* tests?|Executed [1-9][0-9]* tests?' "$RUNNER_TEMP/gamekit-test.log" \
              || { echo "選別したテストが 1 件も走らなかった"; exit 1; }
          fi

  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: アプリ本体のビルド検証（署名なし）
        run: |
          brew install xcodegen
          xcodegen generate
          # 依存の版は Config/Package.resolved で固定する（#1579）。project.yml の指定と食い違うと
          # -disableAutomaticPackageResolution で落ちる（版を上げるときは Config/Package.resolved も更新する）
          bash Scripts/apply-package-resolved.sh
          xcodebuild -project GameCollection.xcodeproj \
            -scheme GameCollection \
            -disableAutomaticPackageResolution \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
