name: Close linked issues on merge

on:
  pull_request:
    types: [closed]
    branches: ['main', 'release/**']

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # 判定は Scripts/closing-issue-numbers.js に切り出してテストしている（#3063）。
      # このワークフローは PR の base 側の定義で動き、release ブランチには Scripts が無いことがあるので、
      # スクリプトは常に main から取得する。
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: Scripts/closing-issue-numbers.js
          persist-credentials: false

      - uses: actions/github-script@v7
        with:
          script: |
            const { closingIssueNumbers } = require('./Scripts/closing-issue-numbers.js');
            const issueNumbers = closingIssueNumbers(context.payload.pull_request.body);
            // 1 件の更新失敗（存在しない番号・権限など）で残りを止めない（#3134）。
            let failed = 0;
            for (const issueNumber of issueNumbers) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed',
                  state_reason: 'completed'
                });
                core.info(`Closed issue #${issueNumber}`);
              } catch (error) {
                failed += 1;
                core.warning(`Failed to close issue #${issueNumber}: ${error.message}`);
              }
            }
            // すべて失敗したときだけジョブを赤にする（一部成功は緑）。
            if (issueNumbers.length > 0 && failed === issueNumbers.length) {
              core.setFailed(`Failed to close all ${failed} linked issue(s)`);
            }
