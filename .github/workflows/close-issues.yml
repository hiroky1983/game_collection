name: Close linked issues on merge

on:
  pull_request:
    types: [closed]
    branches: ['main', 'release/**']

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const raw = context.payload.pull_request.body || '';
            // 引用・コード・HTML コメント内の言及で誤爆しないよう、マッチ前に除去する（#109）。
            // 順序は「フェンス → インラインコード」。逆にするとフェンスの ``` が壊れる。
            const body = raw
              .replace(/^\s{0,3}(?:```|~~~)[\s\S]*?^\s{0,3}(?:```|~~~)\s*$/gm, ' ')
              .replace(/`[^`\n]*`/g, ' ')
              .replace(/<!--[\s\S]*?-->/g, ' ')
              .replace(/^\s{0,3}>.*$/gm, ' ');
            const matches = [...body.matchAll(/(?:closes?|fixes?|resolves?)\s+#(\d+)/gi)];
            const issueNumbers = [...new Set(matches.map((m) => parseInt(m[1], 10)))];
            for (const issueNumber of issueNumbers) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: 'completed'
              });
              core.info(`Closed issue #${issueNumber}`);
            }
