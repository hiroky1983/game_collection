name: Nightly Shogi Self-Play

# GameShogiTests/SelfPlayTests.swift（自己対戦で囲い・定跡が進むか）は決定的だが
# CIの中で最も重い1本（実測304秒）。将棋AI強化は中止済み（2026-08-10決裁）で
# ソースが変わる見込みが低いため、毎回のCIから外しここで毎晩だけ回す（#1039）。
# schedule はデフォルトブランチ（main）でのみ実行される GitHub Actions の仕様のため、
# release ブランチでは夜間実行は発火しない。しかし将棋エンジンは release 側で変わりうる
# （v1.1.9 で ShogiEngine.swift を変更。#1737）ため、エンジン・テストを触る PR では
# base（main / release/**）を問わずここでも回す。失敗は PR のチェック赤として現れ、
# 当番の PR 消化（CI 赤はその PR で直す）に載る。
on:
  schedule:
    - cron: '0 18 * * *' # 03:00 JST
  pull_request:
    paths:
      - 'Packages/GameKit/Sources/GameShogi/**'
      - 'Packages/GameKit/Tests/GameShogiTests/**'
      - '.github/workflows/nightly-shogi-selfplay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfplay:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # "SelfPlayTests" 単純一致だと DifficultyTests.swift の ShogiWeakLevelSelfPlayTests も
      # 部分一致で巻き込むため、完全一致になるよう "GameShogiTests.SelfPlayTests/" にアンカーする
      - name: 将棋の自己対戦テスト
        run: swift test --package-path Packages/GameKit --filter '^GameShogiTests\.SelfPlayTests/'
