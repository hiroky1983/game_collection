name: LP ゲーム一覧

# LP（web/app/lib/games.ts）の顔ぶれ・順序が、アプリの GameRegistry と一致しているかを確認する（#296）。
#
# **games.ts を触る PR のときだけ**走らせる。常時実行しない理由は Scripts/check-lp-game-list.sh の
# ヘッダに書いたとおりで、要点は2つ:
#   1. 比較先が PR のツリーではなく別の ref（release/vX.Y.Z）なので、常時実行すると
#      他所のマージで一度緑になった PR が後から赤くなる。
#   2. 新しいゲームを足す PR は release ブランチへ入り、LP（main）の更新はその後の別 PR になる。
#      途中に必ず不一致の期間があるので、常時落とすと正常な途中状態を事故として扱ってしまう。
# 「一致していなければならない唯一の瞬間」= games.ts を触る PR が main にマージされる瞬間だけに絞る。
on:
  pull_request:
    paths:
      - 'web/app/lib/games.ts'
      - 'Scripts/check-lp-game-list.sh'
      - '.github/workflows/lp-game-list.yml'

concurrency:
  group: lp-game-list-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # 比較先の release/vX.Y.Z を `git show` で読むため、全ブランチを取得する
          # （fetch-depth: 0 なら refs/remotes/origin/* が揃う）。
          fetch-depth: 0
          persist-credentials: false

      - name: LP の顔ぶれ・順序がアプリの登録と一致するか
        run: bash Scripts/check-lp-game-list.sh

      - name: check-lp-game-list.sh 自身の検証
        run: bash Scripts/tests/test-check-lp-game-list.sh
